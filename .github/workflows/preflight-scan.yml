name: Preflight Scan

# Dogfooding: scan this repo with the CLI built from source.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write   # PR comment
      security-events: write # SARIF upload to Code Scanning

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json

      - name: Build CLI
        working-directory: packages/cli
        run: npm ci && npm run build

      - name: Run preflight scan
        run: |
          node packages/cli/dist/index.js scan . --format markdown --output preflight.md
          node packages/cli/dist/index.js scan . --format sarif --output preflight.sarif --offline
          cat preflight.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SARIF to Code Scanning
        if: always() && hashFiles('preflight.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: preflight.sarif
          category: agent-preflight

      - name: Comment on PR
        # Fork PRs get a read-only token; the job summary above still has the report.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('preflight.md', 'utf8');
            const marker = '## 🛫 Preflight Scan Results';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

      - name: Fail on high-severity findings
        run: node packages/cli/dist/index.js scan . --fail-on high --format markdown > /dev/null
